<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>中华诗词</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#2b2724;--muted:#8d8075;--accent:#c4510a;--on-accent:#fff;--hero-tint:#ffffff26;--soft:#fff0df;--poem-size:23px;--reading-size:20px;--preview-size:19px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif}#frame{height:100%;display:flex;flex-direction:column;overflow:hidden}header{flex:none;padding:16px 20px 10px;padding-top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:25px;margin:4px 0}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--accent)}#scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}main{max-width:760px;margin:auto;padding:4px 18px 28px}small,.muted{color:var(--muted)}.card{background:var(--card);border-radius:24px;padding:21px;margin:14px 0;box-shadow:0 6px 24px #00000005}.hero{background:var(--accent);color:var(--on-accent)}.hero small{color:inherit;opacity:.8}.hero h2{font-family:serif;font-size:29px;line-height:1.5}.hero button{background:var(--hero-tint);color:var(--on-accent)}.hero .tag{background:var(--hero-tint);color:var(--on-accent)}.hero .hero-verse{font-family:'Songti SC',serif;font-size:var(--poem-size);line-height:2.1;white-space:pre-wrap;text-align:center;margin:25px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.actions{display:flex;gap:7px}.actions button{flex:1;padding:11px 5px;white-space:nowrap}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.tiles button{text-align:left;background:var(--card);padding:20px;border-radius:22px;line-height:1.8}.tiles b{display:block;font-size:18px}.tiles span{font-size:12px;color:var(--muted)}button,select,input,textarea{font:inherit;border:0;border-radius:13px;padding:12px;background:var(--soft);color:var(--ink)}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button.primary,button.active{background:var(--accent);color:var(--on-accent)}button.ghost{background:transparent;color:var(--muted);padding:8px 10px}input:not([type=range]),textarea{width:100%;outline-color:var(--accent);margin:10px 0}input[type=range]{padding:0;width:100%;height:36px;accent-color:var(--accent);margin:6px 0}textarea{min-height:120px;line-height:1.8;resize:vertical}h2{margin:9px 0;font-size:23px}h3{font-size:19px;margin:0 0 10px}.poem{cursor:pointer}.poem p{color:var(--muted);font-size:var(--preview-size);line-height:1.8;margin-bottom:0}.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--soft);border-radius:8px;padding:4px 8px}nav{flex:none;background:var(--card);display:flex;justify-content:space-around;gap:3px;z-index:20;padding:9px 8px max(12px,env(safe-area-inset-bottom));border-top:1px solid #8882}nav button{flex:1;background:none;padding:10px 3px;font-size:14px}nav button.active{background:var(--soft);color:var(--accent)}body.native-shell nav{display:none}.verse{font-family:'Songti SC',serif;font-size:var(--poem-size);line-height:2.1;white-space:pre-wrap;text-align:center;overflow-wrap:anywhere;padding:20px 0}.detail-title{text-align:center;margin-top:12px}.settings label{display:block;margin:18px 0 8px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;top:20px;left:5%;right:5%;padding:15px;background:#29231ff2;color:white;border-radius:14px;z-index:99;display:none;pointer-events:none}.empty{text-align:center;padding:35px 10px;line-height:1.9}.counter{font-size:13px;color:var(--muted);line-height:1.7}.reading p{font-size:var(--reading-size);line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere}.reading h3{color:var(--accent);margin-top:20px}.mode-tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0;flex-wrap:nowrap}.mode-tabs button{white-space:nowrap;font-size:14px;padding:10px 12px}.font-controls{padding-top:12px;margin-top:16px;border-top:1px solid #8882}.font-controls button{padding:7px 12px}.stats{display:flex;justify-content:space-around;text-align:center;gap:8px}.stats b{display:block;font-size:25px;color:var(--accent);margin-bottom:5px}.masked-line{display:block;margin:8px auto;padding:8px;width:100%;font-family:'Songti SC',serif;font-size:var(--poem-size);line-height:1.8;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.study-verse{text-align:center}.question{border-left:3px solid var(--accent);padding-left:14px}.status{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 0 0;min-height:23px}.result{padding:15px;border-radius:14px;background:var(--soft);line-height:1.8;white-space:pre-wrap}.ai-text{white-space:pre-wrap;font-size:var(--reading-size);line-height:1.95;overflow-wrap:anywhere}a{color:var(--accent)}.break{overflow-wrap:anywhere}.icon{font-size:24px;color:var(--accent)}
@media(max-width:350px){header{padding-left:15px;padding-right:15px}main{padding-left:12px;padding-right:12px}.card{padding:16px}.actions button{font-size:14px}.mode-tabs{gap:5px}.mode-tabs button{padding:9px}}
</style><script src="__CONVERTER_URL__"></script></head><body><div id="frame"><header><div><span class="eyebrow">POETRY · EVERY DAY</span><h1>中华诗词<span style="color:var(--accent)">.</span></h1></div><div style="text-align:right"><span class="tag" id="badge">离线诗库</span><br><button class="ghost" id="scriptToggle" aria-label="切换简繁" onclick="setTextScript(user.text_script==='simplified'?'traditional':'simplified')">简/繁</button><button class="ghost" id="exitButton" onclick="requestExit()">退出阅读</button></div></header><div id="scroller"><main id="app"></main></div><nav id="nav" aria-label="主导航"></nav></div><div role="status" class="toast" id="toast"></div>
<script>/*BOOTSTRAP*/
const themes={
 '活力橙':{light:['#fff7ef','#fff','#fff0df'],dark:['#1d1713','#2b221b','#3b2e23'],accent:['#c4510a','#ff9a52']},
 '奶油杏':{light:['#f5efdf','#fffdf7','#eee5d0'],dark:['#1d1a13','#2b271e','#3b3427'],accent:['#87601f','#e6bd76']},
 '桃花粉':{light:['#fff0f3','#fffafb','#fce0e8'],dark:['#20161b','#30212a','#422d39'],accent:['#b73568','#ee8bad']},
 '竹叶青':{light:['#eff5ed','#fcfffa','#dfebd8'],dark:['#151c17','#202d24','#2d3d31'],accent:['#347440','#8cc99c']},
 '晴空蓝':{light:['#eef5fb','#fbfdff','#dceaf6'],dark:['#141b22','#1f2a36','#2a3b4d'],accent:['#2465ad','#85b7ef']},
 '暮山紫':{light:['#f3eff9','#fdfbff','#e8dff4'],dark:['#1b1724','#292235','#392f49'],accent:['#7550a5','#b79ae3']},
 '墨香灰':{light:['#f1f1ee','#fff','#e2e3de'],dark:['#181a1c','#26292d','#353a40'],accent:['#555d67','#afb9c6']},
 '赤陶棕':{light:['#f8eee7','#fffcf8','#eeded0'],dark:['#211714','#32231e','#453027'],accent:['#a14730','#e6a18a']}
};
const DEFAULT_UPDATE_URL='https://raw.githubusercontent.com/chenxianfu1378817/chinese-poetry-pythonista/updates/update_channel/manifest.json';
let demo=!window.BOOT;
let boot=window.BOOT||{poems:[],user:{},version:'1.5.1'};
let user=Object.assign({favorites:[],notes:{},theme:'活力橙',mode:'system',update_url:DEFAULT_UPDATE_URL,text_script:'simplified',speech_voice:'',speech_rate:0.9,voice_backend:'web',font_size:23,learning:{},ai_cache:{},ai_endpoint:'https://api.deepseek.com',ai_model:'deepseek-flash'},boot.user);
let originals=boot.poems,poems=boot.poems,tab='home',query='',category='',selected=null,detailMode='read',limit=40,studyMode='cover',revealed=0,aiBusy={},speechMessage=boot.voice_notice||'',nativeStyle='',toastTimer=null;
const $=id=>document.getElementById(id),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toSimplified=window.OpenCC?OpenCC.Converter({from:'t',to:'cn'}):x=>x;
const toTraditional=window.OpenCC?OpenCC.Converter({from:'cn',to:'t'}):x=>x;
let scriptCache={},searchCache=new Map();
function displayText(text){text=String(text||'');return user.text_script==='simplified'?toSimplified(text):user.text_script==='traditional'?toTraditional(text):text}
function updateTextView(){let mode=user.text_script||'simplified';if(!scriptCache[mode])scriptCache[mode]=originals.map(p=>({...p,title:displayText(p.title),author:displayText(p.author),paragraphs:p.paragraphs.map(displayText)}));poems=scriptCache[mode];if(selected)selected=poems.find(p=>p.id===selected.id);$('scriptToggle').textContent=mode==='simplified'?'简体':mode==='traditional'?'繁体':'原文'}
function setTextScript(mode){persistDraft();stopReading();let drafts={};['aiKey','aiEndpoint','aiModel','dictation'].forEach(id=>{if($(id))drafts[id]=$(id).value});user.text_script=mode;updateTextView();bridge('save',{text_script:mode});render();Object.keys(drafts).forEach(id=>{if($(id))$(id).value=drafts[id]})}
let bridgeQueue=[],bridgeBusy=false;
function bridge(action,data={}){if(demo){localStorage.setItem('poetry-demo-user',JSON.stringify(user));if(action==='speak'){nativeSpeechResult({ok:false});speechStatus('桌面演示请在设置选择网页朗读')}if(action==='stop')speechStatus('朗读已停止');if(action==='update')notice('演示模式：请在 Pythonista 中检查更新');if(action==='ai')receiveAI({id:data.id,error:'请在 Pythonista 设置中配置 AI 服务与钥匙串密钥，演示不会发送网络请求。'});if(action==='ai_key')notice('请在 Pythonista 中保存密钥；演示不收集密钥');if(action==='ai_settings')aiSettings({configured:false});return}bridgeQueue.push({action,data});pumpBridge()}
function pumpBridge(){if(bridgeBusy||!bridgeQueue.length)return;bridgeBusy=true;let message=bridgeQueue[0];fetch(boot.api_url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(message)}).then(r=>r.json()).then(result=>{if(result.error){notice(result.error);if(message.action==='ai')receiveAI({id:message.data.id,error:result.error})}if(result.ai)receiveAI(result.ai);if('key_configured' in result)aiSettings({configured:result.key_configured});if(result.update){let box=$('updateInstall');if(box)box.innerHTML='<button class="primary" onclick="bridge(\'install_update\')">安装 '+esc(result.update.version)+'</button>'}bridgeDone(result)}).catch(()=>{if(message.action==='ai')receiveAI({id:message.data.id,error:'连接未完成，请重试'});bridgeDone({message:'本机连接未完成，请重新打开 main.py'})})}
function bridgeDone(result={}){bridgeQueue.shift();bridgeBusy=false;if(result.user&&!bridgeQueue.some(m=>['save','favorite','practice'].includes(m.action)))receiveUser(result.user);if(result.message)notice(result.message);pumpBridge()}
function receiveUser(u){user=Object.assign(user,u);applyTheme();updateFavoriteButtons();syncFontControls()}
let mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){let dark=user.mode==='dark'||(user.mode==='system'&&mq.matches),t=themes[user.theme]||themes['活力橙'];let vars=[...(dark?t.dark:t.light),...(dark?['#f5f1eb','#b9aea3']:['#2b2724','#73675c']),t.accent[dark?1:0],dark?'#211b16':'#fff',dark?'#00000012':'#ffffff26'];['bg','card','soft','ink','muted','accent','on-accent','hero-tint'].forEach((k,i)=>document.documentElement.style.setProperty('--'+k,vars[i]));document.documentElement.style.colorScheme=dark?'dark':'light';applyFont();if(boot.native_shell){let style={bg:vars[0],card:vars[1],soft:vars[2],ink:vars[3]},signature=JSON.stringify(style);if(signature!==nativeStyle){nativeStyle=signature;bridge('style',style)}}}
if(mq.addEventListener)mq.addEventListener('change',applyTheme);else if(mq.addListener)mq.addListener(applyTheme);
function applyFont(){let n=Math.max(16,Math.min(40,parseInt(user.font_size)||23));document.documentElement.style.setProperty('--poem-size',n+'px');document.documentElement.style.setProperty('--reading-size',Math.max(16,n-3)+'px');document.documentElement.style.setProperty('--preview-size',Math.max(16,n-4)+'px')}
function notice(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').style.display='block';toastTimer=setTimeout(()=>$('toast').style.display='none',4200)}
function save(data){Object.assign(user,data);applyTheme();bridge('save',data)}
function draftSnapshot(){let note=$('note');return selected&&note?{id:selected.id,note:note.value}:{}}
function persistDraft(){let data=draftSnapshot();if(data.id&&user.notes[data.id]!==data.note){user.notes[data.id]=data.note;bridge('save',data)}}
function requestExit(){persistDraft();stopReading();if(demo){$('app').innerHTML='<div class="card empty"><h2>已退出阅读</h2><p>收藏、手记和设置已保存在本浏览器。</p><button class="primary" onclick="go(\'home\')">重新打开</button></div>';notice('桌面演示保留浏览器页面；Pythonista 会关闭阅读器');return}bridge('exit')}
function scrollTop(){$('scroller').scrollTop=0}
function go(t){clearTimeout(window.searchTimer);persistDraft();tab=t;selected=null;query='';category='';authorFilter='';collectionFilter='';catalogSeq++;limit=40;render();scrollTop();if(boot.native_shell)bridge('navigate',{tab:t})}
function openPoem(id,mode='read'){persistDraft();selected=poems.find(p=>p.id===id);if(!selected){api('poem',{id}).then(r=>{if(r.poem){absorb([r.poem]);openPoem(id,mode)}});return;}detailMode=mode;studyMode='cover';revealed=0;render();scrollTop()}
function setDetail(mode){persistDraft();detailMode=mode;render();scrollTop()}
function today(){return poems.find(p=>p.id===boot.today)||poems.find(p=>p.featured)||poems[0]}
function favorite(id){let i=user.favorites.indexOf(id);if(i<0)user.favorites.push(id);else user.favorites.splice(i,1);updateFavoriteButtons();bridge('favorite',{id})}
function updateFavoriteButtons(){document.querySelectorAll('[data-favorite]').forEach(b=>{let yes=user.favorites.includes(b.dataset.favorite);b.textContent=yes?'♥ 已收藏':'♡ 收藏';b.setAttribute('aria-pressed',String(yes))})}
function cards(items){return items.slice(0,limit).map(p=>`<article class="card poem" role="button" tabindex="0" onclick="openPoem('${p.id}','${tab==='learn'?'recite':'read'}')"><span class="tag">${esc(p.category)}</span>${user.learning[p.id]?'<span class="tag">'+(user.learning[p.id].status==='mastered'?'已背熟':'学习中')+'</span>':''}<h3 style="margin-top:12px">${esc(p.title)}</h3><small>${esc(p.author)}</small><p>${esc(p.paragraphs[0])}</p></article>`).join('')}
function fontControls(){return `<div class="font-controls"><div class="row spread"><span>阅读字号 <b data-font-label>${user.font_size}</b></span><span><button aria-label="减小字号" onclick="setFont(Number(user.font_size)-1,true)">A−</button> <button aria-label="增大字号" onclick="setFont(Number(user.font_size)+1,true)">A＋</button></span></div><input type="range" min="16" max="40" step="1" value="${user.font_size}" aria-label="阅读字号" data-font-slider oninput="setFont(this.value,false)" onchange="setFont(this.value,true)"><div class="counter">16–40，逐级调节并记住你的选择</div></div>`}
function setFont(n,persist){user.font_size=Math.max(16,Math.min(40,Number(n)||23));applyFont();syncFontControls();if(persist)bridge('save',{font_size:user.font_size})}
function syncFontControls(){document.querySelectorAll('[data-font-label]').forEach(e=>e.textContent=user.font_size);document.querySelectorAll('[data-font-slider]').forEach(e=>e.value=user.font_size)}
function searchText(p){if(!searchCache.has(p.id)){let raw=originals.find(x=>x.id===p.id)||p;searchCache.set(p.id,toSimplified(raw.title+raw.author+raw.paragraphs.join('')).toLocaleLowerCase())}return searchCache.get(p.id)}
function results(){let q=toSimplified(query).toLocaleLowerCase().trim();return poems.filter(p=>(!category||p.category===category)&&(tab!=='favorites'||user.favorites.includes(p.id))&&(!q||searchText(p).includes(q)))}
let catalogSeq=0,catalogRows=[],catalogOffset=0,authorFilter='',collectionFilter='';
function api(action,data={}){return fetch(boot.api_url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data})}).then(r=>r.json())}
function absorb(rows){let map=new Map(originals.map(p=>[p.id,p]));rows.forEach(p=>map.set(p.id,p));originals=Array.from(map.values());scriptCache={};searchCache.clear();updateTextView()}
function list(more=false){if(!$('results'))return;if(demo){let items=results();$('results').innerHTML=cards(items);return}let seq=++catalogSeq;if(!more){catalogRows=[];catalogOffset=0;$('results').innerHTML='<p class="counter">正在查询本机诗库…</p>'}api('catalog',{query:toSimplified(query),category,author:authorFilter,collection:collectionFilter,favorites:tab==='favorites',offset:catalogOffset,limit:40}).then(r=>{if(seq!==catalogSeq||!$('results'))return;if(!r.catalog){$('results').textContent=r.error||'查询未完成';return}let data=r.catalog;absorb(data.poems);catalogRows=catalogRows.concat(data.poems.map(p=>p.id));catalogOffset+=data.poems.length;let view=catalogRows.map(id=>poems.find(p=>p.id===id));let oldLimit=limit;limit=view.length;$('results').innerHTML='<div class="counter">找到 '+data.total+' 首 · 已显示 '+catalogRows.length+' 首 · 主库 '+(boot.stats?boot.stats.total:poems.length)+' 首</div>'+cards(view)+(data.more?'<button onclick="list(true)">再看40首</button>':'')+(!data.total?'<div class="empty">未找到匹配作品</div>':'');limit=oldLimit}).catch(()=>{if(seq===catalogSeq&&$('results'))$('results').textContent='本机查询未完成，请重试'})}
function authorChoice(name){authorFilter=name;list()}
function collectionChoice(name){collectionFilter=name;list()}
function selectCategory(c,button){category=c;limit=40;list();document.querySelectorAll('#categories button').forEach(b=>b.classList.remove('active'));button.classList.add('active')}
function render(){applyTheme();$('badge').textContent='离线 '+(boot.stats?boot.stats.total:poems.length)+' 首';$('nav').innerHTML=[['home','今日'],['library','诗库'],['learn','学习'],['favorites','收藏'],['settings','设置']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${n}</button>`).join('');
if(selected){renderDetail();return}
if(tab==='home'){let p=today();$('app').innerHTML=`<p class="muted">把一小段时间，留给诗意。</p>${p?`<article class="card hero"><div class="row spread"><small>今日诗词 · ${new Date().toLocaleDateString()}</small><span class="tag">${esc(p.category)}</span></div><div class="detail-title"><h2 onclick="openPoem('${p.id}')">${esc(p.title)}</h2><small>${esc(p.author)}</small></div><div class="hero-verse">${esc(p.paragraphs.join('\n'))}</div><div class="actions"><button data-toggle-reading onclick="toggleReading('${p.id}')">♫ 朗读</button><button onclick="openPoem('${p.id}','ai')">✧ AI 解读</button><button data-favorite="${p.id}" onclick="favorite('${p.id}')">♡ 收藏</button></div><p class="status" data-speech-status style="color:inherit">${esc(speechMessage)}</p></article>`:''}<div class="tiles"><button onclick="go('library');$('search').focus()"><span class="icon">⌕</span><b>诗词搜索</b><span>标题 · 作者 · 诗句</span></button><button onclick="go('library')"><span class="icon">▤</span><b>分类阅读</b><span>唐诗 · 宋词 · 诗经</span></button><button onclick="go('learn')"><span class="icon">◇</span><b>学习背诵</b><span>遮盖 · 填空 · 默写</span></button><button onclick="if(today())openPoem(today().id,'ai')"><span class="icon">✧</span><b>AI 解读</b><span>配置服务 · 缓存解读</span></button></div><div class="row"><button class="primary" onclick="randomPoem()">↻ 随机遇见</button><button onclick="if(today())openPoem(today().id,'recite')">背诵今日诗词</button></div><h2 style="margin-top:28px">从熟悉的诗开始</h2><p class="muted">唐宋选本与主要诗人已扩充，按作者和选集探索。</p>${cards(poems.filter(p=>p.featured))}`}
else if(tab==='settings'){renderSettings()}
else if(tab==='learn'){renderLearning()}
else{$('app').innerHTML=`<h2>${tab==='favorites'?'我的收藏':'探索诗库'}</h2><input id="search" placeholder="搜索标题、作者、诗句（简繁皆可）"><div class="row" id="categories">${['','唐诗','宋词','诗经'].map(c=>`<button onclick="selectCategory('${c}',this)" class="${category===c?'active':''}">${c||'全部'}</button>`).join('')}</div><div class="row" style="margin-top:12px"><select aria-label="作者筛选" onchange="authorChoice(this.value)"><option value="">全部作者</option>${(boot.stats?boot.stats.major_authors:[]).filter(a=>boot.stats.authors[a]).map(a=>`<option value="${esc(a)}" ${authorFilter===a?'selected':''}>${esc(displayText(a))} · ${boot.stats.authors[a]}首</option>`).join('')}</select><select aria-label="选集筛选" onchange="collectionChoice(this.value)"><option value="">全部选集</option>${['唐诗三百首','宋词三百首','诗经'].map(c=>`<option value="${c}" ${collectionFilter===c?'selected':''}>${c}</option>`).join('')}</select></div><p class="counter">主库 ${boot.stats?boot.stats.total:poems.length} 首。名篇优先展示；作者数量是去重后的原文记录，可能保留异文。旧版收藏中的作品继续保留。</p><div id="results" style="margin-top:16px"></div>`;$('search').value=query;$('search').oninput=e=>{query=e.target.value;limit=40;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>list(),180)};list()}updateFavoriteButtons();updatePlaybackButtons()}
function renderDetail(){let p=selected;$('app').innerHTML=`<button onclick="persistDraft();selected=null;render()">‹ 返回</button><div class="card"><div class="detail-title"><span class="tag">${esc(p.category)}</span><h2>${esc(p.title)}</h2><small>${esc(p.author)}</small></div><div class="mode-tabs">${[['read','原文'],['recite','背诵'],['ai','AI 解读']].map(([m,n])=>`<button class="${detailMode===m?'active':''}" onclick="setDetail('${m}')">${n}</button>`).join('')}</div><div id="detailBody"></div></div><div class="card"><h3>学习手记</h3><small>随手记下理解、意象与背诵难点</small><textarea id="note" placeholder="写下此刻的感受…">${esc(user.notes[p.id]||'')}</textarea><button class="primary" onclick="saveNote()">保存手记</button></div>`;
if(detailMode==='read'){$('detailBody').innerHTML=`<div class="verse">${esc(p.paragraphs.join('\n'))}</div><div class="row"><button class="primary" data-favorite="${p.id}" onclick="favorite('${p.id}')">♡ 收藏</button><button onclick="speak('${p.id}')">▶ 朗读</button><button onclick="stopReading()">停止</button></div><p class="status" data-speech-status>${esc(speechMessage)}</p>${fontControls()}<p class="counter">显示字形可随时切换；原始文本和异文保留。</p>`}
if(detailMode==='recite')renderRecite();if(detailMode==='ai')renderAI();updateFavoriteButtons();$('note').onchange=persistDraft}
function lines(){return selected.paragraphs.join('').replace(/([，。！？；])/g,'$1|').split('|').filter(s=>s.trim())}
function renderRecite(){let ls=lines();$('detailBody').innerHTML=`<p class="counter">按当前字形练习，简繁写法均可比对。练习进度保存于本地。</p><div class="row">${[['cover','遮盖背诵'],['cloze','填空提示'],['dictation','默写自测']].map(([m,n])=>`<button class="${studyMode===m?'active':''}" onclick="studyMode='${m}';revealed=0;renderRecite()">${n}</button>`).join('')}</div><div id="studyArea"></div><div class="row" style="margin-top:18px"><button onclick="recordPractice(false)">记为学习中</button><button class="primary" onclick="recordPractice(true)">标记已背熟</button><button onclick="speak('${selected.id}')">听读一遍</button></div><p class="status" data-speech-status>${esc(speechMessage)}</p>${fontControls()}`;
if(studyMode==='dictation'){$('studyArea').innerHTML=`<textarea id="dictation" maxlength="4000" placeholder="不看原文，写下你记得的诗句…"></textarea><button class="primary" onclick="checkDictation()">检查默写</button><div id="dictationResult" style="margin-top:14px"></div>`;return}
$('studyArea').innerHTML=`<div class="study-verse">${ls.map((s,i)=>`<button class="masked-line" data-line="${i}" onclick="this.textContent=lines()[${i}]">${esc(i<revealed?s:s.replace(/[\u3400-\u9fff]/g,(c,j)=>studyMode==='cloze'&&j%3!==0?c:'□'))}</button>`).join('')}</div><div class="row"><button onclick="revealed=Math.min(lines().length,revealed+1);renderRecite()">揭示下一句</button><button onclick="revealed=lines().length;renderRecite()">显示全文</button><button onclick="revealed=0;renderRecite()">重新遮盖</button></div><p class="counter">点击单句可查看答案，不计入成绩。</p>`}
function normalized(s){return toSimplified(s).replace(/[^\u3400-\u9fffA-Za-z0-9]/g,'').toLowerCase()}
function similarity(a,b){if(a===b)return a.length?100:0;let row=new Uint16Array(b.length+1);for(let i=0;i<a.length;i++){let last=0;for(let j=0;j<b.length;j++){let old=row[j+1];row[j+1]=a[i]===b[j]?last+1:Math.max(row[j+1],row[j]);last=old}}return Math.round(200*row[b.length]/Math.max(1,a.length+b.length))}
function checkDictation(){let actual=$('dictation').value,expected=selected.paragraphs.join('\n'),score=similarity(normalized(expected),normalized(actual));$('dictationResult').innerHTML=`<div class="result"><b>文字相似度 ${score}%</b><p class="counter">忽略标点与空白，兼容简繁写法；古籍异文仍可能影响分数，请对照检查。</p><b>参考原文</b><p>${esc(expected)}</p><b>你的默写</b><p>${esc(actual||'（尚未输入）')}</p></div>`;recordPractice(score===100,score)}
function recordPractice(mastered,score){let old=user.learning[selected.id]||{},today=new Date(),due=new Date(today);let streak=mastered?(old.streak||0)+1:0;due.setDate(due.getDate()+(mastered?[1,3,7,14,30][Math.min(Math.max(streak-1,0),4)]:1));user.learning[selected.id]={...old,streak,status:mastered?'mastered':'learning',attempts:(old.attempts||0)+1,last_practiced:today.toLocaleDateString('sv-SE'),due:due.toLocaleDateString('sv-SE'),last_score:score==null?old.last_score:score};bridge('practice',{id:selected.id,mastered,score});if(demo){localStorage.setItem('poetry-demo-user',JSON.stringify(user));notice('学习进度已保存')}}
function renderLearning(){let progress=user.learning||{},items=poems.filter(p=>progress[p.id]),mastered=items.filter(p=>progress[p.id].status==='mastered'),date=new Date().toLocaleDateString('sv-SE'),due=items.filter(p=>progress[p.id].due<=date);$('app').innerHTML=`<h2>学习背诵</h2><p class="muted">读懂一句，再记住一句。</p><div class="card stats"><div><b>${items.length}</b><small>学习过</small></div><div><b>${mastered.length}</b><small>已背熟</small></div><div><b>${due.length}</b><small>待复习</small></div></div>${due.length?'<h3>今天复习</h3>'+cards(due):''}${items.length?'<h3>我的学习</h3>'+cards(items):'<div class="card"><h3>从入门名篇开始</h3><p class="muted">进入诗词的「背诵」页，选择遮盖、填空或默写，标记进度后会出现在这里。</p></div>'}<h3>入门诗词</h3>${cards(poems.filter(p=>p.featured))}`}
function renderAI(){let p=selected,record=user.ai_cache[p.id];$('detailBody').innerHTML=`<h3>AI 解读</h3><p class="counter">只在你点击生成时，把本首标题、作者与原文发送到你配置的服务；不发送手记。服务可能收费，解读仅作参考。</p><div id="aiOutput">${record?`<span class="tag">已缓存 · ${esc(record.model)}</span><p class="counter">${esc(record.created)}</p><div class="ai-text">${esc(displayText(record.text))}</div>`:'<p class="muted">配置 AI 服务后，可生成白话理解、意象分析与背诵线索。解读结果保存在本地，再次打开可离线阅读。</p>'}</div><div class="row" style="margin-top:18px"><button class="primary" id="generateAI" ${aiBusy[p.id]?'disabled':''} onclick="generateAI()">${aiBusy[p.id]?'解读中…':record?'重新生成':'生成 AI 解读'}</button><button onclick="go('settings');setTimeout(()=>$('aiConfig').scrollIntoView(),0)">配置 AI</button></div><p id="aiError" role="alert" class="status"></p>`}
function generateAI(){let id=selected.id;if(!user.ai_endpoint||!user.ai_model){$('aiError').textContent='请先在设置中填写 AI 服务地址、模型，并保存密钥。';return}if(aiBusy[id])return;aiBusy[id]=true;renderAI();bridge('ai',{id})}
function receiveAI(result){aiBusy[result.id]=false;if(result.record)user.ai_cache[result.id]=result.record;if(demo)localStorage.setItem('poetry-demo-user',JSON.stringify(user));if(selected&&selected.id===result.id&&detailMode==='ai'){renderAI();if(result.error)$('aiError').textContent=result.error}else if(result.error)notice(result.error)}
function aiSettings(result){let e=$('keyStatus');if(e)e.textContent=result.configured?'此服务已保存密钥（iOS 钥匙串）':'此服务尚未保存密钥'}
function renderSettings(){$('app').innerHTML=`<div class="card settings"><h2>让诗意合你心意</h2><label>诗词字形</label><div class="row">${[['simplified','简体'],['traditional','繁体'],['original','原文']].map(([m,n])=>`<button class="${user.text_script===m?'active':''}" onclick="setTextScript('${m}')">${n}</button>`).join('')}</div><p class="counter">离线转换标题、作者、诗句与 AI 解读，不改写原始诗库和个人笔记。</p><label>八套主题</label><div class="themes">${Object.keys(themes).map(t=>`<button class="${user.theme===t?'active':''}" onclick="save({theme:'${t}'});render()">${t}</button>`).join('')}</div><label>外观</label><div class="row">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,n])=>`<button class="${user.mode===v?'active':''}" onclick="save({mode:'${v}'});render()">${n}</button>`).join('')}</div>${fontControls()}</div><div class="card settings"><h3>朗读方式</h3><p class="counter">此版只使用网页朗读，移除导致不稳定的 Pythonista 原生语音调用。若本机网页接口不可用，会提示而不触发原生语音。</p><select aria-label="朗读方式" onchange="stopReading();save({voice_backend:this.value})">${[['web','网页中文朗读'],['off','关闭朗读']].map(([v,n])=>`<option value="${v}" ${user.voice_backend===v?'selected':''}>${n}</option>`).join('')}</select><div id="voicePicker"></div></div><div class="card settings" id="aiConfig"><h3>DeepSeek Flash</h3><p class="counter">使用兼容 Chat Completions 的 HTTPS 服务。模型和密钥由你选择；密钥仅经本机接口保存到手机钥匙串，不写入个人资料文件。</p><label>服务地址（可填 /v1 基础地址）</label><input id="aiEndpoint" placeholder="https://服务域名/v1" value="${esc(user.ai_endpoint)}" autocapitalize="off" autocorrect="off"><label>模型名称（已预设）</label><input id="aiModel" placeholder="填写你的服务支持的模型名称" value="${esc(user.ai_model)}" autocapitalize="off" autocorrect="off"><label>DeepSeek API key</label><input type="password" id="aiKey" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="填写后点击保存密钥"><div class="row"><button onclick="saveAIConfig()">保存服务</button><button onclick="saveAPIKey()">保存密钥</button><button onclick="bridge('ai_delete_key')">移除密钥</button></div><p class="counter" id="keyStatus">进入设置不读取钥匙串；保存或生成解读时才使用密钥</p></div><div class="card settings"><h3>版本 ${esc(boot.version)}</h3><label>GitHub 更新地址</label><input id="updateUrl" value="${esc(user.update_url)}" autocapitalize="off" autocorrect="off"><button onclick="save({update_url:$('updateUrl').value.trim()});notice('更新地址已保存')">保存地址</button> <button class="primary" onclick="bridge('update')">检查更新</button><div id="updateInstall"></div><p class="counter">更新后用退出按钮关闭，再运行 main.py。收藏、手记和学习进度保留。</p><button onclick="bridge('rollback')">回退随包版本</button></div><div class="card"><h3>阅读与数据</h3><p class="counter">原文来自 chinese-poetry，MIT 许可；解读统一使用 DeepSeek Flash，生成后保存在本地。个人资料保存在 user_data 文件夹。</p><a href="https://github.com/chenxianfu1378817/chinese-poetry-pythonista">项目与反馈 ↗</a><p><button onclick="requestExit()">保存并退出阅读</button></p></div>`;renderVoicePicker()}
function saveAPIKey(){let key=$('aiKey').value.trim();if(!key){notice('请填写 DeepSeek API key');return}bridge('save',{ai_endpoint:$('aiEndpoint').value.trim(),ai_model:$('aiModel').value.trim()});bridge('ai_key',{key});$('aiKey').value=''}
function saveAIConfig(){let endpoint=$('aiEndpoint').value.trim(),model=$('aiModel').value.trim();if(endpoint&&!/^https:\/\//i.test(endpoint)){notice('请填写 HTTPS 服务地址');return}save({ai_endpoint:endpoint,ai_model:model});notice('服务已保存；首次还需点击设置密钥')}
let webUtterance=null,webReading=false,nativeReading=false;
function webSpeechAvailable(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)}
function updatePlaybackButtons(){document.querySelectorAll('[data-toggle-reading]').forEach(e=>e.textContent=(webReading||nativeReading)?'■ 停止':'♫ 朗读')}
function toggleReading(id){if(webReading||nativeReading)stopReading();else speak(id)}
function nativeSpeechResult(result){if(!result.ok)nativeReading=!!result.active;updatePlaybackButtons()}
function speak(id){
let mode=user.voice_backend||'auto';
if(mode==='off'){speechStatus('朗读已关闭，可在设置中重新启用');return}
if(webReading||nativeReading){notice('已有朗读请求，请先点击停止');return}
if(mode==='web'||(mode==='auto'&&webSpeechAvailable())){webSpeak(id);return}
speechStatus('本机没有提供网页朗读接口；为避免闪退，本版不调用 Pythonista 原生语音。')
}
function stopReading(){
if(webReading&&window.speechSynthesis){webReading=false;webUtterance=null;try{speechSynthesis.cancel()}catch(e){}}
if(nativeReading){nativeReading=false;bridge('stop')}
updatePlaybackButtons();speechStatus('朗读已停止')
}
function speechStatus(message){speechMessage=message;document.querySelectorAll('[data-speech-status]').forEach(e=>e.textContent=message)}
function deviceVoices(){if(!webSpeechAvailable())return [];try{return speechSynthesis.getVoices().filter(v=>/^(zh|cmn|yue)(-|_|$)/i.test(v.lang)&&v.localService!==false).sort((a,b)=>a.name.localeCompare(b.name))}catch(e){return []}}
function voiceKey(v){return JSON.stringify([v.voiceURI||'',v.name,v.lang])}
function selectedDeviceVoice(){if(!user.speech_voice)return null;return deviceVoices().find(v=>voiceKey(v)===user.speech_voice)||null}
function renderVoicePicker(){let box=$('voicePicker');if(!box)return;let voices=deviceVoices(),found=voices.some(v=>voiceKey(v)===user.speech_voice);box.innerHTML=`<label>本机中文声音</label><select id="deviceVoice" aria-label="本机中文声音" style="width:100%" onchange="chooseDeviceVoice(this.value)"><option value="">系统自动选择</option>${user.speech_voice&&!found?`<option value="${esc(user.speech_voice)}" selected>上次选择的声音（当前尚未列出）</option>`:''}${voices.map(v=>`<option value="${esc(voiceKey(v))}" ${voiceKey(v)===user.speech_voice?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select><p class="counter">已发现 ${voices.length} 个设备中文声音。仅显示网页可调用的音色，保留系统原名，不把普通声音标成优化音质。</p><div class="row"><button onclick="previewDeviceVoice()">试听所选声音</button><button onclick="renderVoicePicker()">刷新声音列表</button><button onclick="stopReading()">停止试听</button></div><label>朗读语速 <span id="rateValue">${Number(user.speech_rate||0.9).toFixed(1)}</span></label><input aria-label="朗读语速" type="range" min="0.6" max="1.2" step="0.1" value="${user.speech_rate||0.9}" oninput="$('rateValue').textContent=Number(this.value).toFixed(1)" onchange="stopReading();save({speech_rate:Number(this.value)})"><p class="counter">不下载录音、不调用付费语音接口。若系统优化音质声音没有出现在列表中，当前 WebView 就无法选择它。</p>`}
function chooseDeviceVoice(value){stopReading();save({speech_voice:value})}
function previewDeviceVoice(){if(user.voice_backend==='off'){notice('请先启用网页朗读');return}stopReading();webSpeak(null,'空山新雨后，天气晚来秋。明月松间照，清泉石上流。')}
if(window.speechSynthesis){let changed=()=>renderVoicePicker();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',changed);else speechSynthesis.onvoiceschanged=changed}
function webSpeak(id,sample){
if(!webSpeechAvailable()){speechStatus('本机 WebView 没有网页朗读接口，当前设备暂时无法朗读。');return}
let poem=poems.find(p=>p.id===id);if(!poem&&!sample)return;
try{
let voice=selectedDeviceVoice();if(user.speech_voice&&!voice){notice('所选声音当前不可用，请刷新列表或改为系统自动选择');return}
let utterance=new SpeechSynthesisUtterance(sample||(poem.title+'。'+poem.author+'。'+poem.paragraphs.join('')));
let voices=deviceVoices();voice=voice||voices.find(v=>/^zh[-_]CN$/i.test(v.lang))||voices[0];
utterance.rate=Math.max(0.6,Math.min(1.2,Number(user.speech_rate)||0.9));
if(voice)utterance.voice=voice;utterance.lang=voice?voice.lang:'zh-CN';
utterance.onstart=()=>speechStatus('正在网页朗读');
utterance.onerror=e=>{if(webUtterance!==utterance)return;webReading=false;webUtterance=null;updatePlaybackButtons();speechStatus('网页朗读未完成（'+(e.error||'语音不可用')+'）；未自动重试。请检查媒体音量或更换朗读方式。')};
utterance.onend=()=>{if(webUtterance!==utterance)return;webReading=false;webUtterance=null;updatePlaybackButtons();speechStatus('网页朗读结束')};
webUtterance=utterance;webReading=true;updatePlaybackButtons();speechStatus('已请求网页中文朗读…');speechSynthesis.speak(utterance)
}catch(e){webReading=false;webUtterance=null;updatePlaybackButtons();speechStatus('网页朗读未启动；未调用系统语音重试。')}
}
function saveNote(){let data=draftSnapshot();if(data.id){user.notes[data.id]=data.note;bridge('save',data);if(demo)notice('手记已保存')}}
function randomPoem(){if(demo){if(poems.length)openPoem(poems[Math.floor(Math.random()*poems.length)].id);return}api('random').then(r=>{if(r.poem){absorb([r.poem]);openPoem(r.poem.id)}else notice(r.error||'暂未找到作品')}).catch(()=>notice('本机请求未完成，请重试'))}
updateTextView();
if(boot.native_shell)document.body.classList.add('native-shell');
if(window.visualViewport){let fit=()=>document.body.style.height=Math.round(visualViewport.height)+'px';visualViewport.addEventListener('resize',fit);fit()}
if(demo){try{user=Object.assign(user,JSON.parse(localStorage.getItem('poetry-demo-user'))||{})}catch(e){}let ready=window.DEMO_DATA?Promise.resolve(window.DEMO_DATA):fetch('../data/poems.json').then(r=>r.json());ready.then(data=>{originals=Array.isArray(data)?data:data.poems;scriptCache={};searchCache.clear();updateTextView();if(!Array.isArray(data)){boot.readings=data.readings||{};boot.today=data.today}render()}).catch(()=>notice('请通过演示服务器打开，或使用完整离线演示文件'))}render();
</script></body></html>
