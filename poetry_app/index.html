<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>中华诗词</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#2b2724;--muted:#8d8075;--accent:#f47725;--soft:#fff0df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:24px 22px 12px;padding-top:max(24px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:5px 0}small,.muted{color:var(--muted)}main{max-width:760px;margin:auto;padding:4px 20px 110px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--accent)}.card{background:var(--card);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 6px 24px #00000005}.hero{background:var(--accent);color:white;position:relative;overflow:hidden}.hero small{color:#fff9}.hero h2{font-family:serif;font-size:30px}.hero p{font-family:serif;font-size:21px;line-height:1.9}.hero button{background:#ffffff28;color:white}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:0;border-radius:14px;padding:12px;background:var(--soft);color:var(--ink)}button{cursor:pointer}button.primary{background:var(--accent);color:white}button.active{background:var(--accent);color:#fff}input,textarea{width:100%;outline-color:var(--accent)}input{margin:12px 0}textarea{min-height:120px;line-height:1.8}h2{margin:10px 0;font-size:22px}h3{font-size:19px;margin:0 0 9px}.poem{cursor:pointer}.poem p{color:var(--muted);line-height:1.7;margin-bottom:0}.tag{font-size:12px;color:var(--accent);background:var(--soft);border-radius:8px;padding:4px 8px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:12px 10px max(14px,env(safe-area-inset-bottom));border-top:1px solid #8882}nav button{background:none;padding:9px 12px;font-size:14px}nav button.active{background:var(--soft);color:var(--accent)}.verse{font-family:'Songti SC',serif;font-size:23px;line-height:2.1;white-space:pre-wrap;text-align:center;padding:20px 0}.detail-title{text-align:center;margin-top:24px}.settings label{display:block;margin:18px 0 8px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;top:24px;left:6%;right:6%;padding:16px;background:#29231fee;color:white;border-radius:14px;z-index:9;display:none}.empty{text-align:center;padding:45px 10px}.counter{font-size:13px;color:var(--muted)}a{color:var(--accent)}
</style><body><header><div><span class="eyebrow">POETRY · EVERY DAY</span><h1>中华诗词<span style="color:var(--accent)">.</span></h1></div><span class="tag" id="badge">离线诗库</span></header><main id="app"></main><nav id="nav"></nav><div class="toast" id="toast"></div>
<script>/*BOOTSTRAP*/
const themes={'活力橙':['#fff7ef','#fff','#fff0df'],'奶油杏':['#f5efdf','#fffdf7','#eee5d0'],'桃花粉':['#fff0f3','#fffafb','#fce0e8'],'竹叶青':['#eff5ed','#fcfffa','#dfebd8'],'晴空蓝':['#eef5fb','#fbfdff','#dceaf6'],'暮山紫':['#f3eff9','#fdfbff','#e8dff4'],'墨香灰':['#f1f1ee','#fff','#e2e3de'],'赤陶棕':['#f8eee7','#fffcf8','#eeded0']};
let demo=!window.BOOT;
let boot=window.BOOT||{poems:[],user:{favorites:[],notes:{},theme:'活力橙',mode:'system',update_url:'https://raw.githubusercontent.com/chenxianfu1378817/chinese-poetry-pythonista/updates/update_channel/manifest.json'},version:'1.0.3'};
let user=boot.user,poems=boot.poems,tab='home',query='',category='',selected=null,limit=40;
const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bridge(action,data={}){if(demo){localStorage.setItem('poetry-demo-user',JSON.stringify(user));if(action==='speak'&&window.speechSynthesis){let s=new SpeechSynthesisUtterance(data.text);s.lang='zh-CN';speechSynthesis.speak(s)}if(action==='stop'&&window.speechSynthesis)speechSynthesis.cancel();if(action==='update')notice('演示模式；在线更新请在 Pythonista 中使用');return}location.href='poetry:'+encodeURIComponent(JSON.stringify({action,data}))}
function receiveUser(u){user=u;applyTheme();if(selected){let b=$('fav');if(b)b.textContent=user.favorites.includes(selected.id)?'♥ 已收藏':'♡ 收藏'}else render()}
let mq=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){let dark=user.mode==='dark'||(user.mode==='system'&&mq.matches),t=themes[user.theme]||themes['活力橙'];let vars=dark?['#17191d','#24272d','#33363c','#f5f1eb','#ada8a0']:[...t,'#2b2724','#8d8075'];['bg','card','soft','ink','muted'].forEach((k,i)=>document.documentElement.style.setProperty('--'+k,vars[i]));document.documentElement.style.colorScheme=dark?'dark':'light'}
if(mq.addEventListener)mq.addEventListener('change',applyTheme);else if(mq.addListener)mq.addListener(applyTheme);
function notice(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3600)}
function save(data){Object.assign(user,data);applyTheme();bridge('save',data)}
function go(t){tab=t;selected=null;query='';category='';limit=40;render();window.scrollTo(0,0)}
function openPoem(id){selected=poems.find(p=>p.id===id);render();window.scrollTo(0,0)}
function cards(items){return items.slice(0,limit).map(p=>`<article class="card poem" onclick="openPoem('${p.id}')"><span class="tag">${esc(p.category)}</span><h3 style="margin-top:12px">${esc(p.title)}</h3><small>${esc(p.author)}</small><p>${esc(p.paragraphs[0])}</p></article>`).join('')}
function results(){let q=query.toLocaleLowerCase().trim();return poems.filter(p=>(!category||p.category===category)&&(tab!=='favorites'||user.favorites.includes(p.id))&&(!q||(p.title+p.author+p.paragraphs.join('')).toLocaleLowerCase().includes(q)))}
function list(){let items=results();$('results').innerHTML=`<div class="counter">找到 ${items.length} 首 · 已缓存 ${poems.length} 首</div>`+cards(items)+(items.length>limit?'<button onclick="limit+=40;list()">再看 40 首</button>':'')+(!items.length?'<div class="empty">这里还没有诗词<br><small>试试其他关键词，或先收藏喜欢的作品</small></div>':'')}
function toggleFav(){let id=selected.id,i=user.favorites.indexOf(id);if(i<0)user.favorites.push(id);else user.favorites.splice(i,1);$('fav').textContent=i<0?'♥ 已收藏':'♡ 收藏';bridge('favorite',{id})}
function render(){applyTheme();$('badge').textContent='已缓存 '+poems.length+' 首';$('nav').innerHTML=[['home','⌂ 今日'],['library','▤ 诗库'],['favorites','♡ 收藏'],['settings','⚙ 设置']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${n}</button>`).join('');
if(selected){let p=selected;$('app').innerHTML=`<button onclick="selected=null;render()">‹ 返回</button><div class="card"><div class="detail-title"><span class="tag">${esc(p.category)}</span><h2>${esc(p.title)}</h2><small>${esc(p.author)}</small></div><div class="verse">${esc(p.paragraphs.join('\n'))}</div><div class="row"><button class="primary" id="fav" onclick="toggleFav()">${user.favorites.includes(p.id)?'♥ 已收藏':'♡ 收藏'}</button><button onclick="speak()">▶ 朗读</button><button onclick="bridge('stop')">停止</button><button onclick="let v=document.querySelector('.verse');v.style.fontSize=(parseInt(getComputedStyle(v).fontSize)>=29?23:29)+'px'">字 大/小</button></div></div><div class="card"><h3>学习手记</h3><small>记录理解、背诵进度或喜欢的意象</small><textarea id="note" placeholder="写下此刻的感受…">${esc(user.notes[p.id]||'')}</textarea><button class="primary" onclick="saveNote()">保存手记</button></div><p class="counter">原始诗文来自 chinese-poetry；本版未提供译文与注释，异体字按原数据保留。</p>`;return}
if(tab==='home'){let p=poems.find(p=>p.id===boot.today)||poems[0];$('app').innerHTML=`<p class="muted">把一小段时间，留给诗意。</p>${p?`<article class="card hero"><small>今日一首 · ${new Date().toLocaleDateString()}</small><h2>${esc(p.title)}</h2><small>${esc(p.author)} / ${esc(p.category)}</small><p>${esc(p.paragraphs.slice(0,2).join(''))}</p><button onclick="openPoem('${p.id}')">开始阅读 ↗</button></article>`:''}<div class="row"><button class="primary" onclick="randomPoem()">↻ 随机遇见</button><button onclick="go('library')">探索诗库</button></div><h2 style="margin-top:30px">拾起一句好诗</h2><p class="muted">离线可读 · 随手收藏 · 留下心得</p>${cards(poems.slice(0,3))}`}
else if(tab==='settings'){$('app').innerHTML=`<div class="card settings"><h2>让诗意合你心意</h2><label>八套主题</label><div class="themes">${Object.keys(themes).map(t=>`<button class="${user.theme===t?'active':''}" onclick="save({theme:'${t}'});render()">${t}</button>`).join('')}</div><label>外观</label><div class="row">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,n])=>`<button class="${user.mode===v?'active':''}" onclick="save({mode:'${v}'});render()">${n}</button>`).join('')}</div></div><div class="card settings"><h3>版本 ${esc(boot.version)}</h3><p class="muted">本版已提供离线诗库、搜索、分类、收藏、手记与朗读入口。</p><label>GitHub 更新清单 HTTPS 地址</label><input id="updateUrl" placeholder="已内置官方更新地址" value="${esc(user.update_url)}"><button onclick="save({update_url:$('updateUrl').value.trim()});notice('地址已保存')">保存地址</button> <button class="primary" onclick="if(user.update_url)bridge('update');else notice('请先保存有效的更新地址')">检查更新</button><p class="counter">仅填写你信任的发布者地址。安装后停止脚本并重新运行；收藏与手记保留。</p><button onclick="bridge('rollback')">回退随包版本</button></div><div class="card"><h3>数据与许可</h3><p class="muted">诗文来自 chinese-poetry/chinese-poetry，MIT 许可。当前为精选离线数据包，非全库。用户数据保存在 user_data 文件夹，可自行备份。</p><a href="https://github.com/chinese-poetry/chinese-poetry">查看数据来源 ↗</a></div>`}
else{$('app').innerHTML=`<h2>${tab==='favorites'?'我的收藏':'探索诗库'}</h2><input id="search" placeholder="搜索标题、作者、诗句（保留原文字形）"><div class="row" id="categories">${['','唐诗','宋词','诗经'].map(c=>`<button onclick="category='${c}';limit=40;list();document.querySelectorAll('#categories button').forEach(b=>b.className='');this.className='active'" class="${category===c?'active':''}">${c||'全部'}</button>`).join('')}</div><div id="results" style="margin-top:16px"></div>`;$('search').value=query;$('search').oninput=e=>{query=e.target.value;limit=40;list()};list()}}
function speak(){bridge('speak',{text:selected.title+'。'+selected.author+'。'+selected.paragraphs.join('')})}
function saveNote(){let note=$('note').value;user.notes[selected.id]=note;bridge('save',{id:selected.id,note});notice('手记已保存')}
function randomPoem(){if(poems.length)openPoem(poems[Math.floor(Math.random()*poems.length)].id)}
if(demo){try{user=JSON.parse(localStorage.getItem('poetry-demo-user'))||user}catch(e){}fetch('../data/poems.json').then(r=>r.json()).then(p=>{poems=p;let day=new Date().toLocaleDateString();let n=Array.from(day).reduce((a,c)=>a+c.charCodeAt(0),0);boot.today=p[n%p.length].id;render()}).catch(()=>notice('请通过本地演示服务器打开'))}render();
</script></body></html>
