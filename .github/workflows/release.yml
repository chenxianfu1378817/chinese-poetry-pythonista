name: Publish release
on:
  push:
    tags: ['v*']
concurrency:
  group: publish-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test before publishing
        run: python -m unittest -v
      - name: Build and validate version
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python make_release.py --tag "$TAG" --base-url "https://raw.githubusercontent.com/$REPO/updates/update_channel"
      - name: Publish GitHub direct update channel
        run: |
          if git ls-remote --exit-code origin refs/heads/updates; then
            git fetch origin updates
            git worktree add --detach update-publish FETCH_HEAD
          else
            git worktree add --detach update-publish HEAD
          fi
          mkdir -p update-publish/update_channel
          cp release_build/*.zip release_build/manifest.json release_build/SHA256SUMS.txt update-publish/update_channel/
          git -C update-publish config user.name "github-actions[bot]"
          git -C update-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C update-publish add update_channel
          git -C update-publish commit -m "Publish verified update channel"
          git -C update-publish push origin HEAD:refs/heads/updates
      - name: Publish installation and update assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG"
          release_build/ChinesePoetry-*.zip
          release_build/poetry-*.zip
          release_build/manifest.json
          release_build/SHA256SUMS.txt
          --repo "$REPO"
          --verify-tag
          --title "中华诗词 $TAG"
          --notes-file RELEASE_NOTES.md
      - name: Verify public update downloads and installation
        run: python verify_online_update.py
