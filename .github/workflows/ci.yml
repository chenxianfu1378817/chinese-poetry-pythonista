name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python check_frontend.py
      - run: python -m compileall -q main.py poetry_app make_release.py
